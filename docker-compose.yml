version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url_shortener_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=url_shortener
      - NODE_ENV=production
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    container_name: url_shortener_mongodb
    restart: always
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
    driver: local

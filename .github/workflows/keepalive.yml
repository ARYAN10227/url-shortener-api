name: Keep alive

# Free-tier hosting goes idle: Render sleeps after ~15 minutes without traffic, and MongoDB
# Atlas can pause or remove an unused free cluster. This job pings the API (which pings the
# database) on a schedule so both stay active, and it fails loudly if the service is down.
on:
  schedule:
    - cron: "*/14 * * * *" # every 14 minutes: keeps Render awake so visitors never wait
    - cron: "17 3 * * *" # once a day: also refreshes the workflow (see the last job)
  workflow_dispatch: # run it by hand from the Actions tab

permissions:
  actions: write # needed by the keepalive step below

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.API_URL || 'https://url-shortener-api-h1dj.onrender.com' }}
    steps:
      - name: Ping API and database
        run: |
          # A cold Render instance can take ~60 s to start, so allow retries.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o body.txt -w "%{http_code}" --max-time 60 "$API_URL/health/db" || true)
            echo "attempt $attempt: HTTP $code $(cat body.txt 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::API or database is not healthy at $API_URL"
          exit 1

  # GitHub disables scheduled workflows after 60 days without repository activity.
  # This re-enables the workflow through the API so the schedule never silently stops.
  keep-workflow-enabled:
    runs-on: ubuntu-latest
    if: github.event.schedule == '17 3 * * *'
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
